# MODELO: valores reais somente em Settings > Secrets no Streamlit Cloud.
[access]
mode = "google"
allowed_emails = ["administrador@example.com", "operador@example.com"]
admin_emails = ["administrador@example.com"]

[auth]
redirect_uri = "https://SEU_SUBDOMINIO.streamlit.app/oauth2callback"
cookie_secret = "SUBSTITUIR_POR_SEGREDO_ALEATORIO_DE_32_OU_MAIS_CARACTERES"

[auth.google]
client_id = "SEU_CLIENT_ID.apps.googleusercontent.com"
client_secret = "SUBSTITUIR_EM_CONFIGURACAO_PRIVADA"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[database]
# Percent-encode caracteres especiais da senha. Exige CA verificável.
url = "postgresql://SEU_USUARIO:SUA_SENHA@SEU_HOST:5432/SEU_BANCO?sslmode=verify-full&sslrootcert=system"

[datajud]
api_key = "SUBSTITUIR_PELA_CHAVE_DATAJUD"
