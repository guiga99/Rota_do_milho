# Copie para secrets.toml (ignorado pelo Git) e configure valores reais.
# Ou execute scripts/configurar_google.py no computador/servidor autorizado.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "GERAR_UM_SEGREDO_ALEATORIO_DE_PELO_MENOS_32_CARACTERES"

[auth.google]
client_id = "PREENCHER_COM_O_CLIENT_ID_GOOGLE"
client_secret = "PREENCHER_EM_CONFIGURACAO_PROTEGIDA"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
mode = "google"
allowed_emails = ["operador@example.com", "administrador@example.com"]
admin_emails = ["administrador@example.com"]
